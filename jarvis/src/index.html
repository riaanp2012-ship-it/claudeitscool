<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; connect-src 'self'; media-src 'self' blob:; img-src 'self' data:" />
  <title>J.A.R.V.I.S.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="grid-bg"></div>
  <div class="scanline"></div>

  <header class="titlebar">
    <div class="brand">J.A.R.V.I.S.<span>Just A Rather Very Intelligent System</span></div>
    <div class="top-right">
      <span id="clock" class="mono">--:--:--</span>
      <button id="settingsBtn" class="icon-btn" title="Settings">⚙</button>
    </div>
  </header>

  <main>
    <aside class="panel left">
      <h3>SYSTEM</h3>
      <div class="stat"><label>STATUS</label><b id="statusText">BOOTING</b></div>
      <div class="stat"><label>VOICE LINK</label><b id="voiceLink">—</b></div>
      <div class="stat"><label>AI CORE</label><b id="aiLink">—</b></div>
      <div class="stat"><label>DATE</label><b id="dateText">—</b></div>
      <h3>ACTIVITY</h3>
      <ul id="activity" class="activity"></ul>
    </aside>

    <section class="core">
      <canvas id="orb"></canvas>
      <div id="stateLabel" class="state-label">INITIALIZING</div>
      <div id="caption" class="caption"></div>
    </section>

    <aside class="panel right">
      <h3>COMMS LOG</h3>
      <div id="log" class="log"></div>
    </aside>
  </main>

  <footer class="inputbar">
    <button id="micBtn" class="mic on" title="Toggle voice (M)">
      <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2z"/></svg>
    </button>
    <input id="textInput" placeholder="Speak, or type a command, sir…" autocomplete="off" />
    <button id="sendBtn" class="send">SEND</button>
  </footer>

  <div id="settings" class="modal hidden">
    <div class="modal-card">
      <h2>CONFIGURATION</h2>
      <label>ElevenLabs API key <em id="elevenState"></em><input id="elevenKey" type="password" placeholder="sk_…" /></label>
      <label>AI (Gemini) API key <em id="geminiState"></em><input id="geminiKey" type="password" placeholder="Paste key" /></label>
      <label>ElevenLabs voice ID<input id="voiceId" /></label>
      <label>Gemini model<input id="model" /></label>
      <label class="row"><input id="resetPerms" type="checkbox" /> Reset "Always allow" permissions</label>
      <p class="hint">Keys are stored locally on this Mac only.</p>
      <div class="actions">
        <button id="clearChat" class="ghost">CLEAR MEMORY</button>
        <button id="closeSettings" class="ghost">CANCEL</button>
        <button id="saveSettings" class="send">SAVE</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
