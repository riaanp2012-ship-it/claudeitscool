<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Portal to Windows</title>
<style>
  :root {
    --void: #05030f;
    --glow: #8b5cf6;
    --glow2: #22d3ee;
    --desk: #008080;
    --win-face: #c0c0c0;
    --win-light: #ffffff;
    --win-shadow: #808080;
    --win-dark: #000000;
    --title-a: #000080;
    --title-b: #1084d0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--void); font-family: "Segoe UI", Tahoma, sans-serif; user-select: none; }

  /* ---------- the void side ---------- */
  #void { position: fixed; inset: 0; }
  #stars { position: absolute; inset: 0; width: 100%; height: 100%; }
  #prompt {
    position: absolute; left: 50%; bottom: 8vh; transform: translateX(-50%);
    color: #e9e5ff; text-align: center; pointer-events: none;
  }
  #prompt h1 { margin: 0 0 6px; font-size: clamp(22px, 4vw, 40px); letter-spacing: .08em; text-shadow: 0 0 18px var(--glow); }
  #prompt p { margin: 0; opacity: .75; font-size: 15px; }
  #summon {
    pointer-events: auto; margin-top: 16px; padding: 12px 26px; font-size: 16px; font-weight: 600;
    color: #fff; background: linear-gradient(90deg, var(--glow), var(--glow2)); border: 0; border-radius: 999px;
    cursor: pointer; box-shadow: 0 0 24px #8b5cf688;
  }
  #summon:hover { filter: brightness(1.15); }

  /* ---------- the windows side, seen through the portal ---------- */
  #desktop {
    position: fixed; inset: 0; background: var(--desk);
    clip-path: circle(0px at 50% 45%);
    transition: clip-path 1.1s cubic-bezier(.7, 0, .2, 1);
    font-family: "MS Sans Serif", Tahoma, Geneva, sans-serif; font-size: 13px;
  }
  #desktop.peek { clip-path: circle(var(--r, 120px) at 50% 45%); }
  #desktop.open { clip-path: circle(150vmax at 50% 45%); }
  #desktop:not(.open) * { pointer-events: none; }
  #desktop.peek { cursor: pointer; }
  #desktop.peek:not(.open) { transition: none; }

  .icons { position: absolute; top: 12px; left: 12px; display: grid; gap: 14px; }
  .icon { width: 76px; text-align: center; color: #fff; cursor: pointer; padding: 4px; }
  .icon .glyph { font-size: 34px; line-height: 40px; filter: drop-shadow(1px 1px 0 #0006); }
  .icon span { display: block; margin-top: 2px; padding: 1px 2px; }
  .icon.sel span { background: var(--title-a); outline: 1px dotted #fff; }

  .bevel-out { background: var(--win-face); border: 2px solid; border-color: var(--win-light) var(--win-dark) var(--win-dark) var(--win-light); box-shadow: inset -1px -1px var(--win-shadow), inset 1px 1px #dfdfdf; }
  .bevel-in { background: #fff; border: 2px solid; border-color: var(--win-shadow) var(--win-light) var(--win-light) var(--win-shadow); }

  .window { position: absolute; min-width: 220px; min-height: 120px; display: flex; flex-direction: column; padding: 2px; animation: pop .18s ease-out; }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
  .titlebar { display: flex; align-items: center; gap: 6px; padding: 3px 3px 3px 6px; color: #fff; font-weight: bold; cursor: move;
    background: linear-gradient(90deg, var(--title-a), var(--title-b)); }
  .window.blur .titlebar { background: linear-gradient(90deg, #808080, #b5b5b5); }
  .titlebar .t { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tb-btn { width: 18px; height: 16px; padding: 0; font: bold 11px/1 sans-serif; color: #000; cursor: pointer; display: grid; place-items: center; }
  .tb-btn:active, button.w95:active { border-color: var(--win-dark) var(--win-light) var(--win-light) var(--win-dark); }
  .body { flex: 1; display: flex; flex-direction: column; padding: 6px; overflow: hidden; }
  .grip { position: absolute; right: 0; bottom: 0; width: 14px; height: 14px; cursor: nwse-resize; }
  button.w95 { font: inherit; padding: 4px 10px; cursor: pointer; }

  textarea.note { flex: 1; resize: none; font: 14px "Lucida Console", monospace; padding: 4px; outline: none; user-select: text; }
  canvas.paint { flex: 1; cursor: crosshair; background: #fff; touch-action: none; }
  .palette { display: flex; gap: 3px; flex-wrap: wrap; margin-bottom: 6px; }
  .swatch { width: 20px; height: 20px; cursor: pointer; }
  .swatch.on { outline: 2px solid #000; outline-offset: 1px; }

  .calc { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .calc .screen { grid-column: span 4; text-align: right; font: 20px "Lucida Console", monospace; padding: 6px; overflow: hidden; }

  .mines { display: grid; gap: 0; margin: 0 auto; }
  .cell { width: 22px; height: 22px; display: grid; place-items: center; font-weight: bold; cursor: pointer; font-size: 13px; }
  .cell.open { border: 1px solid var(--win-shadow); background: #bdbdbd; box-shadow: none; }
  .mine-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; padding: 4px; }
  .lcd { background: #000; color: #f00; font: bold 18px monospace; padding: 0 4px; min-width: 42px; text-align: center; }

  #taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: 34px; display: flex; align-items: center; gap: 4px; padding: 2px 4px; z-index: 99999; }
  #start { font-weight: bold; display: flex; align-items: center; gap: 4px; }
  #tasks { flex: 1; display: flex; gap: 4px; overflow: hidden; }
  .task { max-width: 160px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
  .task.active { border-color: var(--win-dark) var(--win-light) var(--win-light) var(--win-dark); background: #dcdcdc; }
  #clock { padding: 4px 10px; }
  #startmenu { position: absolute; left: 2px; bottom: 34px; width: 210px; display: none; z-index: 100000; }
  #startmenu.show { display: flex; }
  #startmenu .side { width: 26px; background: linear-gradient(0deg, var(--title-a), var(--title-b)); color: #fff; writing-mode: vertical-rl; transform: rotate(180deg); font-weight: bold; padding: 6px 4px; font-size: 16px; }
  #startmenu ul { list-style: none; margin: 0; padding: 2px; flex: 1; }
  #startmenu li { padding: 7px 8px; cursor: pointer; display: flex; gap: 8px; }
  #startmenu li:hover { background: var(--title-a); color: #fff; }
  #startmenu hr { border: 0; border-top: 1px solid var(--win-shadow); border-bottom: 1px solid #fff; margin: 2px 0; }

  #ring { position: fixed; left: 50%; top: 45%; width: 0; height: 0; pointer-events: none; }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .5s; }

  @media (max-width: 600px) {
    .window { left: 8px !important; right: 8px; width: auto !important; }
  }
</style>
</head>
<body>
<div id="void">
  <canvas id="stars"></canvas>
  <div id="prompt">
    <h1>PORTAL TO WINDOWS</h1>
    <p id="hint">Something flickers in the dark…</p>
    <button id="summon">✦ Open a portal</button>
  </div>
</div>

<div id="desktop">
  <div class="icons" id="icons"></div>
  <div id="startmenu" class="bevel-out">
    <div class="side">Windows 95</div>
    <ul id="startlist"></ul>
  </div>
  <div id="taskbar" class="bevel-out">
    <button id="start" class="w95 bevel-out">🪟 Start</button>
    <div id="tasks"></div>
    <div id="clock" class="bevel-in" style="background:var(--win-face)"></div>
  </div>
</div>
<div id="flash"></div>

<script>
(() => {
  'use strict';
  const $ = (s, el = document) => el.querySelector(s);
  const desktop = $('#desktop');
  const cv = $('#stars');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1;
  let state = 'closed'; // closed | peek | open
  let portalR = 0, targetR = 0;

  // ---------- starfield + swirling portal ----------
  const stars = Array.from({ length: 260 }, () => ({ a: Math.random() * Math.PI * 2, d: Math.random(), s: Math.random() * 1.6 + .3 }));
  const sparks = Array.from({ length: 180 }, () => ({ a: Math.random() * Math.PI * 2, r: Math.random(), v: .4 + Math.random() * .9, h: Math.random() }));

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (state === 'peek') targetR = peekRadius();
  }
  const peekRadius = () => Math.min(W, H) * 0.22;
  addEventListener('resize', resize);
  resize();

  function frame(t) {
    const time = t / 1000;
    portalR += (targetR - portalR) * 0.08;
    const cx = W / 2, cy = H * 0.45;
    ctx.fillStyle = '#05030f';
    ctx.fillRect(0, 0, W, H);

    // stars drift toward the portal
    const maxD = Math.hypot(W, H) / 2;
    for (const s of stars) {
      s.d -= 0.0006 * (1 + portalR / 60);
      if (s.d < 0.02) s.d = 1;
      const r = s.d * maxD;
      s.a += 0.0008 * (portalR > 0 ? 3 / (s.d + .2) : 1);
      const x = cx + Math.cos(s.a) * r, y = cy + Math.sin(s.a) * r;
      ctx.fillStyle = `rgba(220,215,255,${.25 + s.d * .6})`;
      ctx.fillRect(x, y, s.s, s.s);
    }

    if (portalR > 1) {
      const R = portalR;
      // outer glow
      const g = ctx.createRadialGradient(cx, cy, R * .8, cx, cy, R * 2.2);
      g.addColorStop(0, 'rgba(139,92,246,.75)');
      g.addColorStop(.35, 'rgba(34,211,238,.25)');
      g.addColorStop(1, 'rgba(5,3,15,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(cx, cy, R * 2.2, 0, Math.PI * 2); ctx.fill();

      // swirl arms
      ctx.save();
      ctx.translate(cx, cy);
      for (let arm = 0; arm < 6; arm++) {
        ctx.beginPath();
        for (let i = 0; i <= 60; i++) {
          const k = i / 60;
          const ang = arm * Math.PI / 3 + time * 1.6 + k * 4;
          const rr = R * (1.02 + k * .55);
          const x = Math.cos(ang) * rr, y = Math.sin(ang) * rr;
          i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        }
        ctx.strokeStyle = arm % 2 ? 'rgba(34,211,238,.55)' : 'rgba(167,139,250,.65)';
        ctx.lineWidth = 3;
        ctx.stroke();
      }
      // sparks orbiting the rim
      for (const p of sparks) {
        p.a += 0.01 * p.v;
        const rr = R * (1 + p.r * .5) + Math.sin(time * 3 + p.h * 9) * 4;
        ctx.fillStyle = `hsla(${250 - p.h * 70},95%,75%,${.9 - p.r * .6})`;
        ctx.fillRect(Math.cos(p.a) * rr, Math.sin(p.a) * rr, 2.2, 2.2);
      }
      // rim
      ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2);
      ctx.lineWidth = 5; ctx.strokeStyle = '#e9d5ff'; ctx.shadowColor = '#a78bfa'; ctx.shadowBlur = 30; ctx.stroke();
      ctx.restore();
    }

    if (state === 'peek') {
      const wobble = portalR + Math.sin(time * 4) * 3;
      desktop.style.setProperty('--r', `${Math.max(0, wobble - 2)}px`);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- portal state machine ----------
  const summon = $('#summon'), hint = $('#hint');
  function openPeek() {
    state = 'peek';
    targetR = peekRadius();
    desktop.classList.add('peek');
    desktop.classList.remove('open');
    summon.textContent = '⟶ Step through';
    hint.textContent = 'A portal hums open. Is that… a desktop on the other side?';
    if (!document.querySelector('.window')) openApp('welcome');
  }
  function stepThrough() {
    state = 'open';
    targetR = Math.hypot(W, H);
    const f = $('#flash');
    f.style.opacity = '.7';
    setTimeout(() => (f.style.opacity = '0'), 180);
    desktop.classList.add('open');
    $('#prompt').style.opacity = '0';
  }
  function closePortal() {
    state = 'closed';
    desktop.classList.remove('open', 'peek');
    desktop.style.setProperty('--r', '0px');
    targetR = 0;
    $('#startmenu').classList.remove('show');
    $('#prompt').style.opacity = '1';
    summon.textContent = '✦ Open a portal';
    hint.textContent = 'The portal snaps shut. Your windows wait on the other side.';
  }
  summon.addEventListener('click', () => (state === 'closed' ? openPeek() : stepThrough()));
  desktop.addEventListener('click', () => { if (state === 'peek') stepThrough(); });
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && state === 'open') closePortal(); });

  // ---------- window manager ----------
  let z = 10, nextId = 1, cascade = 0;
  const tasks = $('#tasks');

  function focusWin(w) {
    document.querySelectorAll('.window').forEach((o) => o.classList.toggle('blur', o !== w));
    w.style.zIndex = ++z;
    document.querySelectorAll('.task').forEach((b) => b.classList.toggle('active', b.dataset.id === w.dataset.id));
  }

  function createWindow({ title, icon, width = 360, height = 260, center = false, build }) {
    const id = String(nextId++);
    const w = document.createElement('div');
    w.className = 'window bevel-out';
    w.dataset.id = id;
    const maxW = Math.min(width, innerWidth - 20), maxH = Math.min(height, innerHeight - 60);
    const off = (cascade++ % 8) * 26;
    Object.assign(w.style, {
      width: maxW + 'px', height: maxH + 'px',
      left: Math.max(6, Math.min(innerWidth - maxW - 6, 110 + off)) + 'px',
      top: Math.max(6, Math.min(innerHeight - maxH - 40, 40 + off)) + 'px',
    });
    if (center) Object.assign(w.style, { left: (innerWidth - maxW) / 2 + 'px', top: innerHeight * 0.45 - maxH / 2 + 'px' });
    w.innerHTML = `<div class="titlebar"><span>${icon}</span><span class="t">${title}</span>
      <button class="tb-btn bevel-out" data-a="min">_</button>
      <button class="tb-btn bevel-out" data-a="max">□</button>
      <button class="tb-btn bevel-out" data-a="close">✕</button></div>
      <div class="body"></div><div class="grip"></div>`;
    desktop.insertBefore(w, $('#startmenu'));
    build($('.body', w), w);

    const task = document.createElement('button');
    task.className = 'w95 bevel-out task';
    task.dataset.id = id;
    task.textContent = `${icon} ${title}`;
    task.addEventListener('click', () => {
      if (w.style.display === 'none') { w.style.display = ''; focusWin(w); }
      else if (task.classList.contains('active')) { w.style.display = 'none'; task.classList.remove('active'); }
      else focusWin(w);
    });
    tasks.appendChild(task);

    w.addEventListener('pointerdown', () => focusWin(w));
    const tb = $('.titlebar', w);
    tb.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button') || w.dataset.max) return;
      const sx = e.clientX - w.offsetLeft, sy = e.clientY - w.offsetTop;
      const move = (ev) => {
        w.style.left = Math.max(-w.offsetWidth + 60, Math.min(innerWidth - 60, ev.clientX - sx)) + 'px';
        w.style.top = Math.max(0, Math.min(innerHeight - 60, ev.clientY - sy)) + 'px';
      };
      const up = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); };
      addEventListener('pointermove', move); addEventListener('pointerup', up);
    });
    tb.addEventListener('dblclick', () => toggleMax());
    $('.grip', w).addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      const sx = e.clientX, sy = e.clientY, ow = w.offsetWidth, oh = w.offsetHeight;
      const move = (ev) => {
        w.style.width = Math.max(220, ow + ev.clientX - sx) + 'px';
        w.style.height = Math.max(120, oh + ev.clientY - sy) + 'px';
        w.dispatchEvent(new Event('resized'));
      };
      const up = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); };
      addEventListener('pointermove', move); addEventListener('pointerup', up);
    });
    function toggleMax() {
      if (w.dataset.max) {
        Object.assign(w.style, JSON.parse(w.dataset.max));
        delete w.dataset.max;
      } else {
        w.dataset.max = JSON.stringify({ left: w.style.left, top: w.style.top, width: w.style.width, height: w.style.height });
        Object.assign(w.style, { left: '0px', top: '0px', width: innerWidth + 'px', height: innerHeight - 34 + 'px' });
      }
      w.dispatchEvent(new Event('resized'));
    }
    tb.addEventListener('click', (e) => {
      const a = e.target.closest('button')?.dataset.a;
      if (a === 'close') { w.dispatchEvent(new Event('closing')); w.remove(); task.remove(); }
      if (a === 'min') { w.style.display = 'none'; task.classList.remove('active'); }
      if (a === 'max') toggleMax();
    });
    focusWin(w);
    return w;
  }

  // ---------- apps ----------
  const apps = {
    welcome: {
      title: 'Welcome', icon: '🌀', width: 380, height: 240, center: true,
      build(b) {
        b.innerHTML = `<p style="margin:4px 0 8px"><b>You made it through the portal!</b></p>
          <p style="margin:0 0 8px">This is the other side. Double-click icons to open programs. Drag windows by their title bar and resize them from the corner.</p>
          <p style="margin:0 0 12px">To go back, use <b>Start → Close portal</b> or press <b>Esc</b>.</p>
          <div style="text-align:right"><button class="w95 bevel-out" data-ok>OK</button></div>`;
        $('[data-ok]', b).addEventListener('click', () => $('[data-a="close"]', b.parentElement).click());
      },
    },
    notepad: {
      title: 'Notepad', icon: '📝', width: 400, height: 280,
      build(b) {
        const ta = document.createElement('textarea');
        ta.className = 'note bevel-in';
        ta.spellcheck = false;
        let saved = '';
        try { saved = localStorage.getItem('portal-notepad') || ''; } catch { saved = ''; }
        ta.value = saved || 'Dear diary,\nToday I opened a portal to Windows.\n';
        ta.addEventListener('input', () => { try { localStorage.setItem('portal-notepad', ta.value); } catch { /* storage unavailable */ } });
        b.appendChild(ta);
      },
    },
    paint: {
      title: 'Paint', icon: '🎨', width: 460, height: 360,
      build(b, w) {
        const colors = ['#000', '#fff', '#808080', '#c00', '#f80', '#ff0', '#0a0', '#0cc', '#00f', '#90f', '#f0f', '#964B00'];
        let color = '#000', size = 4;
        const pal = document.createElement('div');
        pal.className = 'palette';
        colors.forEach((c, i) => {
          const s = document.createElement('div');
          s.className = 'swatch bevel-in' + (i === 0 ? ' on' : '');
          s.style.background = c;
          s.addEventListener('click', () => { color = c; pal.querySelectorAll('.swatch').forEach((o) => o.classList.toggle('on', o === s)); });
          pal.appendChild(s);
        });
        const sizeBtn = document.createElement('button');
        sizeBtn.className = 'w95 bevel-out';
        sizeBtn.textContent = 'Brush: 4';
        sizeBtn.style.padding = '1px 8px';
        sizeBtn.addEventListener('click', () => { size = size >= 16 ? 2 : size * 2; sizeBtn.textContent = 'Brush: ' + size; });
        const clr = document.createElement('button');
        clr.className = 'w95 bevel-out'; clr.textContent = 'Clear'; clr.style.padding = '1px 8px';
        pal.append(sizeBtn, clr);
        const c = document.createElement('canvas');
        c.className = 'paint bevel-in';
        b.append(pal, c);
        const g = c.getContext('2d');
        const fit = () => {
          const img = c.width ? g.getImageData(0, 0, c.width, c.height) : null;
          c.width = c.clientWidth; c.height = c.clientHeight;
          g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
          if (img) g.putImageData(img, 0, 0);
        };
        requestAnimationFrame(fit);
        w.addEventListener('resized', fit);
        clr.addEventListener('click', () => { g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); });
        let last = null;
        c.addEventListener('pointerdown', (e) => { c.setPointerCapture(e.pointerId); last = [e.offsetX, e.offsetY]; draw(e); });
        c.addEventListener('pointermove', (e) => { if (last) draw(e); });
        c.addEventListener('pointerup', () => (last = null));
        function draw(e) {
          g.strokeStyle = color; g.lineWidth = size; g.lineCap = 'round';
          g.beginPath(); g.moveTo(last[0], last[1]); g.lineTo(e.offsetX, e.offsetY); g.stroke();
          last = [e.offsetX, e.offsetY];
        }
      },
    },
    calc: {
      title: 'Calculator', icon: '🧮', width: 240, height: 300,
      build(b) {
        b.innerHTML = '<div class="calc"><div class="screen bevel-in">0</div></div>';
        const grid = $('.calc', b), scr = $('.screen', b);
        let cur = '0', acc = null, op = null, fresh = true;
        const apply = (a, o, x) => ({ '+': a + x, '−': a - x, '×': a * x, '÷': x === 0 ? NaN : a / x })[o];
        const show = (v) => (scr.textContent = String(+(+v).toPrecision(12)).replace('NaN', 'Error'));
        ['C', '±', '%', '÷', '7', '8', '9', '×', '4', '5', '6', '−', '1', '2', '3', '+', '0', '.', '⌫', '='].forEach((k) => {
          const btn = document.createElement('button');
          btn.className = 'w95 bevel-out'; btn.textContent = k;
          btn.addEventListener('click', () => {
            if (/\d/.test(k)) { cur = fresh || cur === '0' ? k : cur + k; fresh = false; scr.textContent = cur; return; }
            if (k === '.') { if (fresh) { cur = '0'; fresh = false; } if (!cur.includes('.')) cur += '.'; scr.textContent = cur; return; }
            if (k === 'C') { cur = '0'; acc = null; op = null; fresh = true; return show(0); }
            if (k === '⌫') { cur = cur.length > 1 ? cur.slice(0, -1) : '0'; scr.textContent = cur; return; }
            if (k === '±') { cur = String(-cur); return show(cur); }
            if (k === '%') { cur = String(cur / 100); return show(cur); }
            const x = parseFloat(cur);
            if (op && !fresh) acc = apply(acc, op, x); else if (acc === null || !op) acc = x;
            show(acc);
            op = k === '=' ? null : k;
            cur = String(acc); fresh = true;
          });
          grid.appendChild(btn);
        });
      },
    },
    mines: {
      title: 'Minesweeper', icon: '💣', width: 260, height: 330,
      build(b) {
        const N = 9, M = 10;
        b.innerHTML = '<div class="mine-bar bevel-in" style="background:var(--win-face)"><span class="lcd" data-m></span><button class="w95 bevel-out" data-f style="font-size:16px;padding:0 6px">🙂</button><span class="lcd" data-t>000</span></div><div class="mines"></div>';
        const board = $('.mines', b), face = $('[data-f]', b), mc = $('[data-m]', b), tc = $('[data-t]', b);
        board.style.gridTemplateColumns = `repeat(${N}, 22px)`;
        let cells, over, opened, flags, timer, secs;
        const nums = ['', '#00f', '#080', '#f00', '#008', '#800', '#088', '#000', '#888'];
        const nb = (i) => { const r = Math.floor(i / N), c = i % N, out = []; for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) { const rr = r + dr, cc = c + dc; if ((dr || dc) && rr >= 0 && rr < N && cc >= 0 && cc < N) out.push(rr * N + cc); } return out; };
        function reset() {
          clearInterval(timer); timer = null; secs = 0; tc.textContent = '000';
          over = false; opened = 0; flags = 0; face.textContent = '🙂';
          mc.textContent = String(M).padStart(3, '0');
          board.innerHTML = '';
          cells = Array.from({ length: N * N }, (_, i) => {
            const el = document.createElement('div');
            el.className = 'cell bevel-out';
            el.addEventListener('click', () => reveal(i));
            el.addEventListener('contextmenu', (e) => { e.preventDefault(); flag(i); });
            board.appendChild(el);
            return { el, mine: false, open: false, flag: false, n: 0 };
          });
        }
        function plant(safe) {
          let placed = 0;
          while (placed < M) { const i = Math.floor(Math.random() * N * N); if (i !== safe && !cells[i].mine && !nb(safe).includes(i)) { cells[i].mine = true; placed++; } }
          cells.forEach((c, i) => (c.n = nb(i).filter((j) => cells[j].mine).length));
          timer = setInterval(() => { secs = Math.min(999, secs + 1); tc.textContent = String(secs).padStart(3, '0'); }, 1000);
        }
        function flag(i) {
          const c = cells[i]; if (over || c.open) return;
          c.flag = !c.flag; flags += c.flag ? 1 : -1;
          c.el.textContent = c.flag ? '🚩' : '';
          mc.textContent = String(M - flags).padStart(3, '0');
        }
        function reveal(i) {
          if (over) return;
          if (!timer) plant(i);
          const c = cells[i]; if (c.open || c.flag) return;
          if (c.mine) {
            over = true; clearInterval(timer); face.textContent = '😵';
            cells.forEach((o) => { if (o.mine) { o.el.className = 'cell open'; o.el.textContent = '💣'; } });
            c.el.style.background = '#f00';
            return;
          }
          const stack = [i];
          while (stack.length) {
            const k = stack.pop(), o = cells[k];
            if (o.open || o.flag) continue;
            o.open = true; opened++;
            o.el.className = 'cell open';
            o.el.textContent = o.n || ''; o.el.style.color = nums[o.n];
            if (!o.n) stack.push(...nb(k));
          }
          if (opened === N * N - M) { over = true; clearInterval(timer); face.textContent = '😎'; }
        }
        face.addEventListener('click', reset);
        b.parentElement.addEventListener('closing', () => clearInterval(timer));
        reset();
      },
    },
    mycomp: {
      title: 'My Computer', icon: '🖥️', width: 330, height: 230,
      build(b) {
        b.innerHTML = `<div class="bevel-in" style="flex:1;padding:8px;overflow:auto;background:#fff">
          <p style="margin:0 0 6px"><b>System Properties</b></p>
          <p style="margin:0 0 4px">Location: Other side of a portal</p>
          <p style="margin:0 0 4px">Processor: Interdimensional 486 @ 66 MHz</p>
          <p style="margin:0 0 4px">Memory: 16 MB of pure nostalgia</p>
          <p style="margin:0 0 4px">Screen: ${innerWidth}×${innerHeight}</p>
          <p style="margin:0">Portal stability: <span data-s>100</span>%</p></div>`;
        const s = $('[data-s]', b);
        const iv = setInterval(() => (s.textContent = String(90 + Math.floor(Math.random() * 11))), 900);
        b.parentElement.addEventListener('closing', () => clearInterval(iv));
      },
    },
  };

  function openApp(key) {
    $('#startmenu').classList.remove('show');
    createWindow(apps[key]);
  }

  // desktop icons
  const icons = $('#icons');
  [['mycomp'], ['notepad'], ['paint'], ['calc'], ['mines'], ['portal', '🌀', 'Close Portal']].forEach(([k, ic, label]) => {
    const app = apps[k];
    const el = document.createElement('div');
    el.className = 'icon';
    el.innerHTML = `<div class="glyph">${ic || app.icon}</div><span>${label || app.title}</span>`;
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      icons.querySelectorAll('.icon').forEach((o) => o.classList.toggle('sel', o === el));
    });
    el.addEventListener('dblclick', () => (k === 'portal' ? closePortal() : openApp(k)));
    icons.appendChild(el);
  });

  // start menu
  const list = $('#startlist');
  [['mycomp'], ['notepad'], ['paint'], ['calc'], ['mines'], ['hr'], ['portal']].forEach(([k]) => {
    if (k === 'hr') { list.appendChild(document.createElement('hr')); return; }
    const li = document.createElement('li');
    li.innerHTML = k === 'portal' ? '<span>🌀</span><span>Close portal…</span>' : `<span>${apps[k].icon}</span><span>${apps[k].title}</span>`;
    li.addEventListener('click', () => (k === 'portal' ? closePortal() : openApp(k)));
    list.appendChild(li);
  });
  $('#start').addEventListener('click', (e) => { e.stopPropagation(); $('#startmenu').classList.toggle('show'); });
  desktop.addEventListener('pointerdown', (e) => {
    if (!e.target.closest('#startmenu, #start')) $('#startmenu').classList.remove('show');
    if (!e.target.closest('.icon')) icons.querySelectorAll('.icon').forEach((o) => o.classList.remove('sel'));
  });

  const clock = $('#clock');
  const tick = () => (clock.textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }));
  tick(); setInterval(tick, 10000);
})();
</script>
</body>
</html>
